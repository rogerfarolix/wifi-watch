name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        working-directory: desktop-app
      - run: npm test
        working-directory: desktop-app
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop-app
